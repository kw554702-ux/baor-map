<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leonard Green POW Route</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
}

#map {
  width:100%;
  height:100vh;
}

.leaflet-popup-content {
  font-family: Georgia, serif;
  font-size: 14px;
}

 #returnBtn {
  position:absolute;
  top:14px;
  left:14px;
  z-index:1000;

  background:rgba(255,255,255,0.96);
  border:1px solid #cfcfcf;
  border-radius:10px;

  padding:10px 14px;

  font-family:Georgia, serif;
  font-size:14px;
  color:#990000;
  text-decoration:none;

  box-shadow:0 2px 6px rgba(0,0,0,0.15);

  transition:all 0.2s ease;
}

#returnBtn:hover {
  background:#f7f7f7;
  border-color:#999;
}
 .leaflet-tooltip {
  background: rgba(255,255,255,0.95);
  border: 1px solid #999;
  border-radius: 6px;
  color: #333;
  font-family: Georgia, serif;
  font-size: 13px;
  padding: 4px 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="map"></div>

<a href="https://www.sutlerssupreme.co.uk/p/private-leonard-green-rascefi.html"
   id="returnBtn">

  ← Return to Leonard Green article

</a>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// CREATE MAP
const map = L.map('map').setView([50.5, 6.5], 5);

// BASE MAP
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

 

//
// LOCATIONS
//

const lille = [50.6292, 3.0573];
const arras = [50.29111321354557, 2.778012405631989];
const saintOmer = [50.7480, 2.2600];
const wizernes = [50.7100, 2.2430];
const bitburg = [49.96665655154762, 6.528579630114036];
const stalagXXA = [53.0138, 18.5984];


//
// RETREAT ROUTE
//

const retreatRoute = [
  lille,
  saintOmer,
  wizernes
];

L.polyline(retreatRoute, {
  color: '#990000',
  weight: 4
}).addTo(map);

//
// POW MARCH ROUTE
//

const marchRoute = [
  wizernes,
  [50.5, 4.5],
  [50.0, 5.5],
  [49.8, 6.1],
  bitburg
];

L.polyline(marchRoute, {
  color: '#666666',
  weight: 4,
  dashArray: '8, 8'
}).addTo(map);

//
// RAIL ROUTE
//

const railRoute = [
  bitburg,
  [51.0, 8.0],
  [52.0, 12.0],
  stalagXXA
];

L.polyline(railRoute, {
  color: '#222222',
  weight: 4,
  dashArray: '2, 10'
}).addTo(map);

 //
// FIT MAP TO ROUTE
//

const group = new L.featureGroup([
  L.marker(lille),
  L.marker(stalagXXA)
]);

map.fitBounds(group.getBounds(), {
  padding: [40, 40]
});

//
// CIRCLE MARKERS
//

const lilleMarker = L.circleMarker(lille, {
  radius: 8,
  color: '#1f78b4',
  fillColor: '#1f78b4',
  fillOpacity: 0.9,
  weight: 2
})
.addTo(map)
.bindPopup("<b>Lille</b><br>EFI withdrawal route")
.bindTooltip("Lille", {
  permanent: false,
  direction: 'top',
  offset: [0, -8]
});

const arrasMarker = L.circleMarker(arras, {
  radius: 9,
  color: '#ffffff',
  fillColor: '#1b365d',
  fillOpacity: 1,
  weight: 3
})
.addTo(map)
.bindPopup("<b>Arras</b><br>HQ RASC/EFI Northern France")
.bindTooltip("Arras", {
  permanent: false,
  direction: 'top',
  offset: [0, -8]
});

const wizernesMarker = L.circleMarker(wizernes, {
  radius: 8,
  color: '#990000',
  fillColor: '#990000',
  fillOpacity: 0.9,
  weight: 2
})
.addTo(map)
.bindTooltip("Wizernes", {
  permanent: false,
  direction: 'top',
  offset: [0, -8]
});

const bitburgMarker = L.circleMarker(bitburg, {
  radius: 8,
  color: '#666666',
  fillColor: '#666666',
  fillOpacity: 0.9,
  weight: 2
})
.addTo(map)
.bindTooltip("Bitburg", {
  permanent: false,
  direction: 'top',
  offset: [0, -8]
});

const stalagXXAMarker = L.circleMarker(stalagXXA, {
  radius: 8,
  color: '#222222',
  fillColor: '#222222',
  fillOpacity: 0.9,
  weight: 2
})
.addTo(map)
.bindTooltip("Stalag XXA Thorn", {
  permanent: false,
  direction: 'top',
  offset: [0, -8]
});

//
// BRING MARKERS TO FRONT
//

lilleMarker.bringToFront();
arrasMarker.bringToFront();
wizernesMarker.bringToFront();
bitburgMarker.bringToFront();
stalagXXAMarker.bringToFront();



</script>

</body>
</html>
